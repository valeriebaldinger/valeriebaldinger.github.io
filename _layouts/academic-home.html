<!doctype html>
<html lang="{{ site.locale | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    <meta name="theme-color" content="#ffffff">
    <meta property="og:image" content="{{ site.author.avatar | prepend: '/images/' | absolute_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/academic-home.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#home">Skip to main content</a>
    <header class="site-header">
      <nav class="site-nav shell" aria-label="Main navigation">
        <a class="wordmark" href="#home">{{ site.name }}</a>
        <div class="nav-links">
          <a href="#home">Home</a>
          <a href="#research">Research</a>
          <a href="#teaching">Teaching</a>
          <a href="{{ '/files/CV_Valerie_Baldinger.pdf' | relative_url }}">CV</a>
        </div>
      </nav>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer shell">
      <span>&copy; {{ 'now' | date: '%Y' }} {{ site.name }}</span>
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
    </footer>
  </body>
</html>
